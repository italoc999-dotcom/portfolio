<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page GTA</title>
    <link rel="shortcut icon" href="src/imagens/favicon.png" type="image/x-icon">
    <link href="https://fonts.cdnfonts.com/css/chalet" rel="stylesheet">
    <link rel="stylesheet" href="./src/css/style.css">
    <link rel="stylesheet" href="./src/css/reset.css">
    <link rel="stylesheet" href="./src/css/fontes.css">
    <link rel="stylesheet" href="./src/css/responsivo.css">
</head>

<body>
    <header class="cabecalho">
        <div class="logo">
            <img src="./src/imagens/Rockstar-Games-Black-Logo-Vector.svg-.png" id="logo-rockstar"
                alt="Logo Rockstar Games">
            <hr />
            <img src="./src/imagens/grand-theft-auto-v-logo.webp" id="logo-gta" alt="Logo GTA V">
        </div>
        <nav>
            <ul class="menu">
                <li>
                    <a href="#home">Home</a>
                </li>
                <li>
                    <a href="#comprar">Comprar</a>
                </li>
                <li>
                    <a href="https://support.rockstargames.com/categories/200013306" target="_blank">Suporte <img
                            src="./src/imagens/icone-link.png" alt="Icone de Link de suporte"></a>
                </li>
            </ul>
        </nav>
    </header>
    <main class="home" id="home">
        <img class="imagem-fundo" src="./src/imagens/gta-vi-fudo.jpg" alt="Imagem GTA VI">

        <div class="informacoes">
            <div class="lista-de-jogos">
                <img id="gta-v-logo-info" src="./src/imagens/GTA-5-Logo.png" alt="Logo GTA V">
                <img id="gta-online-logo-info" src="./src/imagens/Grand_Theft_Auto_Online_Logo.svg.png"
                    alt="Logo GTA Online">
            </div>
            <h1 class="titulo">Já disponíveis para PlayStation 5 e Xbox Series X/S</h1>
            <p class="texto">Experimente os fênomenos do entretenimento Grand Theft Auto V e GTA Online</p>
            <a class="btn-comprar" href="#comprar">Compre Já</a>
        </div>
    </main>
    <section class="compre-ja" id="comprar">
        <h2 class="titulo">Compre Já</h2>
        <div class="cartao">
            <img class="capa-do-jogo" src="./src/imagens/gta-v-image.jpg" alt="Capa do GTA V">

            <div class="informacoes">
                <h3>Grande Theft Auto</h3>
                <p>Inclui <strong>modo história do GTA V</strong> e <strong>GTA Online</strong></p>
                <ul class="plataformas">
                    <li><img class="logo-plataforma" src="./src/imagens/Ps5-Logo_-_com_nome-removebg-preview.png"
                            alt="Logo PS5"></li>
                    <li><img class="logo-plataforma" src="./src/imagens/seriesx-logo.png" alt="Logo Xbox Series"></li>
                    <li><img class="logo-plataforma" src="./src/imagens/Ps4-logo-com_nome-removebg-preview.png"
                            alt="Logo PS4"></li>
                    <li><img class="logo-plataforma" src="./src/imagens/Xboxone_logo-removebg-preview.png"
                            alt="Logo Xbox One"></li>
                    <li><img class="logo-plataforma" id="pc-logo" src="./src/imagens/pc-logo-removebg-preview.png"
                            alt=""></li>
                </ul>
            </div>
            <button class="btn-plataforma">Selecione a Plataforma
                <ul class="plataformas">
                    <li><img class="logo-plataforma-botao" src="./src/imagens/Ps5-Logo_-_com_nome-removebg-preview.png"
                            alt="Logo PS5"></li>
                    <li><img class="logo-plataforma-botao" src="./src/imagens/Logo-Xbox-Series-removebg-preview.png"
                            alt="Logo Xbox Series"></li>
                    <li><img class="logo-plataforma-botao" src="./src/imagens/Ps4-logo-com_nome-removebg-preview.png"
                            alt="Logo PS4"></li>
                    <li><img class="logo-plataforma-botao" src="./src/imagens/Xboxone_logo-removebg-preview.png"
                            alt="Logo Xbox One"></li>
                    <li><img class="logo-plataforma-botao" src="./src/imagens/pc-logo-removebg-preview.png" alt="PC"></li>
                </ul>
            </button>
        </div>
    </section>

    <script src="./src/js/index.js"></script>
</body>

</html>
